name: Prueba E2E de pedidos (manual)

# La prueba toca la base de datos de produccion (dentro de una transaccion que
# se deshace al final, pero igual).
#
# SOLO se dispara a mano desde la pestaña Actions. El trigger de push se saco a
# proposito: convertia cada despliegue en una prueba contra la base real.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prueba:
    name: E2E por etapa en el droplet
    runs-on: ubuntu-latest
    steps:
      - name: Correr la prueba E2E via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          command_timeout: "15m"
          # Sin abortar y con exit 0: ssh-action corta el paso en el primer
          # comando que falla, y si la prueba falla (que es justo cuando hay
          # que leer el log) no se podria descargar nada.
          script: |
            cd /opt/pollos-lucho
            ./venv/bin/python prueba_etapa_e2e.py > /tmp/e2e.log 2>&1
            echo "codigo de salida de la prueba: $?" >> /tmp/e2e.log
            ./venv/bin/python prueba_resumen.py >> /tmp/e2e.log 2>&1
            cat /tmp/e2e.log
            exit 0

      # El log quedo en el DROPLET, no en la maquina de GitHub. scp directo con
      # la misma clave: la action de scp fallaba y hacia perder el resultado.
      - name: Descargar el resultado del droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          mkdir -p resultados
          # La clave guardada en el secreto suele venir con CRLF de Windows y ssh
          # la rechaza con "bad permissions or bad format". Por eso va con tr.
          printf '%s' "$DROPLET_KEY" | tr -d '\r' > /tmp/llave
          echo "" >> /tmp/llave
          chmod 600 /tmp/llave
          scp -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -i /tmp/llave "$DROPLET_USER@$DROPLET_HOST:/tmp/e2e.log" \
            resultados/e2e-ultimo.log
          rm -f /tmp/llave
          wc -l resultados/e2e-ultimo.log

      - name: Publicar el resultado en el repo
        run: |
          git config user.name  "ci-e2e"
          git config user.email "ci-e2e@local"
          cat resultados/e2e-ultimo.log
          # [skip ci]: este push NO vuelve a disparar ni el deploy ni esta prueba.
          git add resultados/e2e-ultimo.log
          git commit -m "chore: resultado de la prueba E2E [skip ci]" || echo "sin cambios"
          git push origin HEAD:main || true
