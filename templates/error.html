<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>{{ codigo }} - Pollos Lucho</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Jost', 'Segoe UI', sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; background: #0C0908; color: #FFFFFF;
            padding: 24px;
        }
        .error-card {
            background: linear-gradient(160deg, #FCC302 0%, #E3B001 55%, #0C0908 100%);
            border-radius: 18px; padding: 44px 38px; text-align: center;
            max-width: 440px; width: 100%; color: #0C0908;
            box-shadow: 0 18px 50px rgba(0,0,0,.5);
        }
        .codigo { font-size: 86px; font-weight: 800; line-height: 1; font-family: 'Passione One', 'Arial Black', sans-serif; }
        .error-card h1 { font-size: 24px; margin: 10px 0 8px; font-family: 'Passione One', 'Arial Black', sans-serif; letter-spacing: .02em; }
        .error-card p { font-size: 14px; opacity: .85; line-height: 1.55; }
        .btn-volver {
            display: inline-block; margin-top: 22px; padding: 12px 26px;
            background: #0C0908; color: #FCC302; border: none; border-radius: 10px;
            font-family: 'Passione One', 'Arial Black', sans-serif; font-size: 15px;
            text-decoration: none; letter-spacing: .04em; cursor: pointer;
            transition: transform .15s, opacity .2s;
        }
        .btn-volver:hover { transform: translateY(-1px); opacity: .92; }
        .foot { margin-top: 18px; font-size: 11px; opacity: .6; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="codigo">{{ codigo }}</div>
        <h1>{{ titulo }}</h1>
        <p>{{ mensaje }}</p>
        <a class="btn-volver" href="/">VOLVER AL SISTEMA</a>
        <div class="foot">© Pollos Lucho · Sistema de Inventario</div>
    </div>
</body>
</html>
